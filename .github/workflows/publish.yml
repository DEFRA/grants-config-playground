name: Publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '094954420758'

jobs:
  build:
    if: github.run_number != 1
    name: CDP-build-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          npm ci
          npm test

      - name: Build and Publish to CDP
        if: ${{ startsWith(github.event.head_commit.message, 'Create new config version') }}
        uses: DEFRA/cdp-build-action/build@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      #      - name: SonarCloud Scan
      #        uses: SonarSource/sonarqube-scan-action@v5.3.1 #  (or check latest version on https://github.com/marketplace/actions/official-sonarqube-scan)
      #        continue-on-error: true
      #        env:
      #          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Set user
        run: git config user.name github-actions[bot] && git config user.email github-actions[bot]@users.noreply.github.com

      - name: Create release message
        shell: bash
        run: |
          # default to patch version
          version="patch"

          # read all changeset files
          for file in .changeset/*-*-*.md; do

            # skip if not file
            [ -f "$file" ] || continue

            # extract only the version block
            versionblock=$(awk '
              BEGIN { inside=0 }
              /^---$/ {
                if (inside == 0) {
                  inside=1
                  next
                } else {
                  exit
                }
              }
              inside == 1 { print }
            ' "$file")

            # major wins immediately
            if echo "$versionblock" | grep -Eq ':\s*major'; then
              version="major"
              break
            fi

            # minor overrides patch
            if echo "$versionblock" | grep -Eq ':\s*minor'; then
              version="minor"
            fi
          done

          # store as environment variable for later use
          echo "RELEASE_MSG=Create new config version #$version" >> $GITHUB_ENV

      - name: Create Release or Pull Request
        uses: changesets/action@v1
        with:
          commitMode: 'github-api'
          publish: npm run github:release
          commit: ${{ env.RELEASE_MSG }}
          title: ${{ env.RELEASE_MSG }} ⚠️ Don't edit commit message when merging
