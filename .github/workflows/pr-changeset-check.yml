name: PR check changeset exists

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-title:
    runs-on: ubuntu-latest

    steps:
      - name: Check changeset exists
        shell: bash
        run: |
          shopt -s nullglob
          files=(.changeset/*.md)

          if [ ${#files[@]} -eq 0 ]; then
            echo "PR must include at least one changeset file in .changeset/*.md"
            exit 1
          fi

          echo "Found changeset file(s):"
          printf '%s\n' "${files[@]}"
