name: PR check changeset exists

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-title:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Check changeset exists
        shell: bash
        run: |
          if ! find .changeset -maxdepth 1 -type f -regex '.*/[^/]+\.[^/]+\.[^/]+\.md' | grep -q .; then
            echo "PR must include at least one changeset file in .changeset/"
            exit 1
          fi

          echo "Changeset file(s) found:"
          find .changeset -maxdepth 1 -type f -regex '.*/[^/]+\.[^/]+\.[^/]+\.md'
